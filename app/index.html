<title>やっつけ!びょうげんたい</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root { --bg:#0e1a2b; --card:#17283f; --line:#2c4466; --ink:#eef4ff; --mute:#9fb3cf; --accent:#ffd34d; --ok:#4cd38a; --ng:#ff6b6b; --fn:'M PLUS Rounded 1c', system-ui, sans-serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--fn); font-size: 15px; }
#app { max-width: 480px; margin: 0 auto; min-height: 100vh; padding: 8px 10px 18px; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; }
.btn { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 14px; font-weight: 800; cursor: pointer; width: 100%; }
.btn.main { background: linear-gradient(180deg,#ffb84d,#ff8a3d); border-color: #ffd08a; color: #2b1400; }
.btn:disabled { opacity: .4; }
.btn.big { font-size: 19px; padding: 14px; }
.btn.sm { width: auto; padding: 6px 10px; font-size: 13px; border-radius: 10px; }
.btn.opt { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 2px; position: relative; }
.btn.opt em { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--accent); }
.note { color: var(--mute); font-size: 12.5px; font-weight: 500; display: block; }
.note.warn, .warn { color: #ffb36b; }
.tiny { font-size: 11px; }
.c { text-align: center; justify-content: center; }
.row { display: flex; align-items: center; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
a { color: var(--mute); }
.top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; margin-bottom: 8px; }
.top h2 { margin: 0; font-size: 17px; text-align: center; }
.back { background: none; border: 1.5px solid var(--line); border-radius: 10px; padding: 6px 10px; font-weight: 800; }
.tag { display: inline-block; padding: 2px 10px; border-radius: 999px; color: #10203a; font-weight: 800; font-size: 12px; }
.big { font-size: 19px; display: block; margin: 4px 0; }
.got { background: #1f4a37; border-radius: 10px; padding: 8px; }
#toasts { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 50; display: grid; gap: 6px; width: min(92vw, 440px); pointer-events: none; }
.toast { background: rgba(10,18,32,.95); border: 2px solid var(--accent); padding: 8px 14px; border-radius: 14px; text-align: center; font-weight: 800; font-size: 14px; transition: opacity .4s; }
.toast.out { opacity: 0; }
.ov { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 90; padding: 14px; }
.box { background: #1b2f4b; border: 2px solid var(--line); border-radius: 18px; padding: 16px; max-width: 420px; width: 100%; max-height: 88vh; overflow: auto; text-align: center; }
.box p { margin: 8px 0; }
.acts { display: grid; gap: 8px; margin-top: 12px; }
/* タイトル */
.title { display: grid; gap: 12px; padding-top: 10px; }
.logo { display: flex; align-items: center; justify-content: center; gap: 4px; }
.logo h1 { font-size: 25px; line-height: 1.15; text-align: center; margin: 0; color: var(--accent); text-shadow: 0 3px 0 #b34d12; }
.dot { display: inline-block; background: var(--ng); color: #fff; border-radius: 999px; padding: 0 7px; font-style: normal; font-size: 12px; }
.looks { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
.look { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 6px; display: grid; justify-items: center; }
.look.on { border-color: var(--accent); }
/* 説明書 */
.page { background: #f7f2e6; color: #2a2a2a; border-radius: 16px; padding: 14px; min-height: 60vh; }
.page h3 { margin: 0 0 8px; color: #b3471a; text-align: center; }
.page .note { color: #6b6b6b; }
.pnav { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; margin-top: 10px; }
.cats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cat { border: 3px solid; border-radius: 14px; padding: 6px; display: grid; justify-items: center; text-align: center; background: #fff; font-size: 12.5px; }
.cat b { font-size: 17px; }
.map4 { display: grid; gap: 6px; font-size: 16px; background: #fff; border-radius: 12px; padding: 10px; }
.mini { border: 2px solid #c9b88f; border-radius: 12px; overflow: hidden; font-size: 12px; background: #1c2f4a; color: #eef; }
.mtop { background: #2c4466; padding: 5px; }
.mmid { display: flex; justify-content: space-between; padding: 6px; }
.mmid span { display: flex; align-items: center; gap: 4px; }
.mbot { background: #3a2b16; padding: 5px; }
.drugcard { border: 3px solid var(--c); border-radius: 12px; padding: 8px; background: #fff; display: grid; text-align: center; }
.meter { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; }
.meter i { height: 12px; border-radius: 6px; background: #6bd18c; display: block; }
.meter.warn i { background: #ff9f43; }
/* ステージ */
.stages { display: grid; gap: 10px; }
.stage { border-radius: 16px; padding: 12px; border: 2px solid rgba(255,255,255,.15); display: grid; gap: 8px; }
.stage.lock { opacity: .5; }
.asc select { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); border-radius: 8px; padding: 6px; font: inherit; }
.asc .btn { width: auto; margin-left: auto; }
/* ステータス */
.status { display: grid; grid-template-columns: 1.4fr 1fr 1fr auto; gap: 6px; align-items: center; background: #13233a; border-radius: 12px; padding: 6px 8px; font-size: 12px; }
.sb { display: flex; align-items: center; gap: 4px; }
.bar { flex: 1; height: 9px; background: #0a1424; border-radius: 6px; overflow: hidden; position: relative; min-width: 24px; }
.bar i { display: block; height: 100%; }
.hp .bar i { background: linear-gradient(90deg,#ff5d6c,#ff9b6b); }
.gut .bar i { background: #6bd18c; }
.res .bar i { background: #ff9f43; }
.relics { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0; min-height: 26px; }
.relic, .item { background: #1c3150; border: 1.5px solid var(--line); border-radius: 8px; padding: 2px 6px; font-size: 17px; cursor: pointer; }
.item { border-color: var(--accent); }
/* マップ */
.mapwrap { height: calc(100vh - 170px); overflow-y: auto; background: #0b1524; border-radius: 14px; display: flex; justify-content: center; }
.map { position: relative; flex: none; }
.map svg { position: absolute; left: 0; top: 0; }
.map line { stroke: #3a5577; stroke-width: 3; stroke-dasharray: 5 6; }
.map line.done { stroke: var(--accent); stroke-dasharray: none; }
.node { position: absolute; width: 44px; height: 44px; border-radius: 50%; border: 2px solid #3a5577; background: #18283f; font-size: 21px; display: grid; place-items: center; padding: 0; }
.node.can { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(255,211,77,.25); animation: pulse 1.2s infinite; }
.node.past { opacity: .5; }
.node.cur { border-color: #fff; opacity: 1; }
.node.boss { width: 56px; height: 56px; font-size: 28px; margin-left: -6px; margin-top: -6px; border-color: #ff6b6b; }
.node:disabled:not(.past):not(.cur) { opacity: .75; }
@keyframes pulse { 50% { transform: scale(1.08); } }
/* バトル */
.battleScr { display: flex; flex-direction: column; min-height: 100vh; }
.tip { background: #3d3214; border: 1.5px solid var(--accent); border-radius: 10px; padding: 6px 10px; font-size: 13px; margin-bottom: 4px; }
.scene { display: grid; grid-template-columns: 1fr 1.25fr; align-items: end; min-height: 200px; background: radial-gradient(ellipse at 50% 100%, #1d3657 0, #0e1a2b 70%); border-radius: 16px; padding: 6px; }
.left { display: flex; align-items: flex-end; }
.left .doc { margin-right: -16px; z-index: 1; }
.patbox { position: relative; }
.finfo { display: block; max-width: 150px; font-size: 9.5px; line-height: 1.35; color: #ffe9a8; background: #2a2414; border-radius: 6px; padding: 2px 4px; margin-top: 2px; }
.dots { display: flex; flex-wrap: wrap; gap: 2px; justify-content: center; max-width: 120px; } .dots span { background: #1f4a37; border: 1px solid #4cd38a; border-radius: 6px; font-size: 9.5px; padding: 0 4px; }
.imm { position: absolute; left: 0; bottom: -2px; background: #1f3f6b; border: 1px solid #6fa3ff; border-radius: 8px; padding: 0 5px; font-size: 11px; font-weight: 800; white-space: nowrap; }
.guard { position: absolute; top: 0; right: 0; background: #2b6cb0; border-radius: 8px; padding: 0 5px; font-size: 12px; }
.right { display: flex; justify-content: space-around; align-items: flex-end; gap: 4px; }
.foe { display: grid; justify-items: center; text-align: center; position: relative; border-radius: 12px; padding: 2px; border: 2px solid transparent; font-size: 13px; }
.foe.tgt { border-color: rgba(255,211,77,.6); }
.foe .note { font-size: 10.5px; line-height: 1.3; }
.ints { display: flex; gap: 4px; }
.intent { background: #2a1d33; border: 1.5px solid #6d4c8f; border-radius: 8px; padding: 0 6px; font-weight: 800; font-size: 13px; }
.intent.atk { border-color: #ff6b6b; }
.intent.self { border-color: #6bd1ff; }
.fhp { width: 100px; height: 14px; margin-top: 2px; }
.fhp i { background: linear-gradient(90deg,#ff5d6c,#ffb36b); }
.fhp em { position: absolute; inset: 0; font-size: 10.5px; font-style: normal; line-height: 14px; font-weight: 800; }
.pz { overflow: visible; }
.foe.hit .pz { animation: shake .35s; filter: brightness(1.8); }
.foe.miss .pz { animation: wob .35s; }
.foe.atk .pz { animation: lunge .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes wob { 50% { transform: rotate(8deg); } }
@keyframes lunge { 50% { transform: translateX(-24px) scale(1.1); } }
.float { position: absolute; left: 50%; top: 20%; transform: translateX(-50%); font-weight: 900; font-size: 22px; color: #fff; text-shadow: 0 2px 0 #000; animation: up 1.1s forwards; pointer-events: none; white-space: nowrap; z-index: 5; }
.float.bad { color: #ff8080; } .float.heal { color: #7dffa8; } .float.good { color: var(--accent); }
@keyframes up { to { transform: translate(-50%, -40px); opacity: 0; } }
.shelf { margin-top: 6px; background: linear-gradient(180deg,#4a3218,#2e1f0f); border: 3px solid #7a5428; border-radius: 16px; padding: 8px; display: grid; gap: 6px; transition: transform .25s, opacity .25s; }
.shelf.hide { transform: translateY(30px); opacity: .35; pointer-events: none; }
.shtop { display: flex; gap: 6px; align-items: center; }
.shtop .end { margin-left: auto; background: #2f6fd0; border-color: #6fa3ff; }
.ap { display: flex; gap: 3px; }
.ap i { width: 16px; height: 16px; border-radius: 50%; background: #2a1a0a; border: 2px solid #8a6a3a; display: block; }
.ap i.on { background: radial-gradient(circle at 35% 35%, #fff4b8, #ffc23d); border-color: #ffe08a; }
.tabs { display: flex; gap: 4px; overflow-x: auto; }
.tab { background: #3a2812; border: 1.5px solid #7a5428; border-radius: 999px; padding: 3px 10px; font-size: 12px; white-space: nowrap; font-weight: 800; }
.tab.on { background: #ffd34d; color: #2b1400; }
.tabs.big .tab { font-size: 14px; padding: 6px 12px; }
.drugs { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; max-height: 32vh; overflow-y: auto; }
.drug { position: relative; background: #fff8ea; color: #2b1d0a; border: 3px solid var(--c); border-radius: 12px; padding: 14px 4px 5px; display: grid; justify-items: center; text-align: center; line-height: 1.25; min-height: 64px; touch-action: manipulation; }
.drug b { font-size: 13px; overflow-wrap: anywhere; line-height: 1.2; }
.drug b.l2 { font-size: 11.5px; }
.drug b.l3 { font-size: 10px; letter-spacing: -.3px; }
.drug .cls { font-size: 9.5px; color: #6a5a40; }
.drug .gi { font-size: 9.5px; font-weight: 800; background: var(--c); color: #10203a; border-radius: 6px; padding: 0 5px; margin-top: 2px; }
.drug .cost { position: absolute; top: -2px; left: -2px; background: #ffc23d; border-radius: 10px 0 10px 0; padding: 0 6px; font-weight: 800; font-size: 12px; }
.drug .lv { position: absolute; top: -2px; right: -2px; background: #4cd38a; border-radius: 0 10px 0 10px; padding: 0 5px; font-size: 10px; font-weight: 800; }
.drug .cd { position: absolute; inset: 0; background: rgba(20,20,30,.65); color: #fff; display: grid; place-items: center; border-radius: 9px; font-weight: 800; }
.drug.off { opacity: .5; }
.drug.sel { box-shadow: 0 0 0 4px #ffd34d; transform: translateY(-2px); }
.usebar { display: flex; align-items: center; gap: 8px; min-height: 40px; }
.usebar span { flex: 1; font-size: 13px; }
.usebar .btn { width: auto; }
.stats { font-size: 13px; background: #12233a; border-radius: 10px; padding: 6px; }
.pause { position: absolute; right: 10px; top: 52px; background: #1c3150; border: 1.5px solid var(--line); border-radius: 8px; padding: 2px 8px; font-size: 15px; }
.battleScr { position: relative; }
.relics { padding-right: 44px; }
.rank { margin: 8px auto; font-size: 16px; } .rank b { font-size: 44px; display: block; line-height: 1; } .rS b { color: #ffd34d; text-shadow: 0 0 12px #ffb300; } .rA b { color: #7dffa8; } .rB b { color: #7fc8ff; }
.scnb { color: #fff; display: grid; gap: 2px; text-align: left; border-radius: 10px; padding: 6px 8px; margin: -6px -8px; font-weight: 800; } .ov .btn.main .scnb .note, .ov .btn .scnb .note { color: inherit; opacity: .8; }
.btn.endless { background: linear-gradient(180deg,#6b4dff,#3b2bb0); border-color: #b6a6ff; }
#book { position: fixed; inset: 0; z-index: 45; background: rgba(5,10,20,.85); display: grid; place-items: center; padding: 8px; }
.bk { width: min(100%, 460px); height: calc(100vh - 16px); height: calc(100dvh - 16px); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 6px; }
.bktop { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; } .bktop .txt { flex: 1 1 100%; min-width: 0; padding: 6px 10px; }
.bpage { min-height: 0; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; background: #f7f2e6; color: #2a2a2a; border-radius: 8px 16px 16px 8px; padding: 12px 14px; overflow-y: auto; box-shadow: inset 12px 0 16px -10px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.4); border-left: 6px solid #b08960; position: relative; }
.bpage h3 { margin: 4px 0 8px; color: #b3471a; } .bpage .note { color: #6b6b6b; } .bpage p { margin: 6px 0; font-size: 14px; }


.bch { position: absolute; right: 10px; top: 6px; font-size: 11px; color: #a07a4a; font-weight: 800; }
.bnav { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; color: #fff; }
.bhead { display: flex; gap: 10px; align-items: center; } .bhead > div { display: grid; gap: 3px; justify-items: start; }
.bgrid { display: grid; grid-template-columns: repeat(4,1fr); gap: 4px; } .bgrid .bjump { display: grid; justify-items: center; font-size: 10.5px; padding: 3px; }
.blist { display: grid; gap: 4px; } .bjump { background: #fff; border: 1.5px solid #d9c9a6; border-radius: 10px; padding: 6px 10px; text-align: left; color: #2a2a2a; font-weight: 800; display: flex; justify-content: space-between; gap: 6px; }
.bdrug { display: inline-block; background: #fff; border: 1.5px solid #d9c9a6; border-radius: 8px; padding: 1px 6px; margin: 2px; font-size: 12.5px; font-weight: 800; cursor: pointer; }
.bpage details { margin: 4px 0; } .bpage summary { cursor: pointer; padding: 4px; }
.vital { background: #3a1414; border: 1.5px solid #ff6b6b; border-radius: 8px; padding: 6px; font-weight: 800; }
/* どの画面も 画面の高さに おさめる。長い一覧だけ 中で スクロール */
#app.fitScr, #app.mapScr, #app.titleScr, #app.manual { height: 100vh; height: 100dvh; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; }
#app.fitScr > *, #app.mapScr > * { flex: none; }
#app.fitScr > .reward, #app.fitScr > .shop, #app.fitScr > .stages, #app.fitScr > .zgrid, #app.fitScr > .zlist, #app.fitScr > .achs, #app.fitScr > .looks { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-bottom: 6px; }
.shop #out, .reward #skip { position: sticky; bottom: 0; z-index: 2; box-shadow: 0 -6px 12px rgba(0,0,0,.4); }
#app.mapScr { overflow: hidden; } #app.mapScr .mapwrap { flex: 1 1 auto; height: auto; min-height: 0; }
#app.mapScr > p { margin: 4px 0 0; font-size: 11px; }
#app.manual .page { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
#app.titleScr { overflow-y: auto; }
#app.titleScr .title { gap: clamp(6px, 1.4dvh, 12px); padding-top: clamp(2px, 1dvh, 10px); }
@media (max-height: 760px) {
  .titleScr .logo h1 { font-size: 21px; } .titleScr .logo svg { width: 50px; height: 50px; }
  .titleScr .title > .row.c { display: none; }
  .titleScr .btn { padding: 8px 12px; } .titleScr .btn.big { font-size: 16px; padding: 10px; }
  .titleScr .title > p { margin: 0; }
}
/* バトルは 必ず 1画面に おさめる(iPhone SE2 375×667 〜 430×932 で 可変) */
#app.battleScr { height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 6px 8px 8px; }
.battleScr .status { flex: none; padding: 4px 8px; }
.battleScr .relics { flex: none; margin: 3px 0; min-height: 0; }
.battleScr .relic, .battleScr .item { font-size: 14px; padding: 1px 6px; }
.battleScr .pause { top: 44px; padding: 1px 8px; }
.battleScr .tip { flex: none; font-size: 12px; line-height: 1.6; padding: 4px 8px; max-height: 5.2em; overflow-y: auto; }
.battleScr .scene { flex: none; height: clamp(196px, 40dvh, 340px); overflow: hidden; align-items: stretch; }
.battleScr .scene .left { align-self: end; }
.battleScr .right { align-items: stretch; height: 100%; min-height: 0; }
.battleScr .foe { min-height: 0; max-height: 100%; overflow-y: auto; align-content: end; gap: 1px; scrollbar-width: none; }
.battleScr .scene .doc { width: clamp(44px, 9dvh, 76px); height: auto; }
.battleScr .scene .pat { width: clamp(60px, 11dvh, 92px); height: auto; }
.battleScr .foe .pz { width: clamp(46px, 10.5dvh, 104px); height: auto; }
.battleScr .foe .note { font-size: 10px; }
.battleScr .finfo { max-height: 3.6em; overflow-y: auto; }
.battleScr .gram { width: clamp(24px, 4.5dvh, 38px); height: auto; }
.battleScr .drug { min-height: 50px; padding: 12px 3px 4px; }
.battleScr .drug .gi { margin-top: 1px; }
.battleScr .shelf { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 4px; padding: 6px; margin-top: 4px; }
.battleScr .shtop, .battleScr .tabs, .battleScr .usebar { flex: none; }
.battleScr .drugs { flex: 1 1 auto; min-height: 0; max-height: none; }
.battleScr .usebar { min-height: 34px; }
.battleScr .usebar .btn { padding: 6px 14px; }
@media (max-height: 700px) {
  .battleScr .drug { min-height: 52px; padding-top: 12px; }
  .battleScr .tabs .tab { padding: 2px 8px; font-size: 11px; }
  .battleScr .shtop .btn.sm { padding: 4px 8px; }
  .battleScr .foe .note { -webkit-line-clamp: 1; font-size: 9.5px; line-height: 2.1; min-height: 2.1em; }
  .battleScr .tip { max-height: 3.4em; }
}
/* 小さい画面でも 薬だなが 見えるように(2026-11-17) */
.battleScr .status { grid-template-columns: 1.3fr 1fr 1fr auto auto auto; gap: 5px; }
.sbtn { background: #1c3150; border: 1.5px solid var(--line); border-radius: 8px; padding: 1px 6px; font-size: 14px; line-height: 1.3; display: flex; align-items: center; gap: 2px; white-space: nowrap; }
.sbtn small { font-size: 10.5px; font-weight: 800; }
.sceneleft { position: absolute; left: 6px; top: 6px; z-index: 3; display: flex; flex-direction: column; gap: 3px; max-width: 44%; pointer-events: none; }
.sceneleft .syms { position: static; max-width: none; }
.sceneleft .relics { margin: 0; padding: 0; min-height: 0; gap: 3px; pointer-events: auto; }
.sceneleft .relic, .sceneleft .item { background: rgba(19,35,58,.88); font-size: 15px; padding: 0 5px; }
.battleScr .scene { height: clamp(168px, 30dvh, 300px); min-height: 0; }
.battleScr .modebar { flex-wrap: nowrap; min-width: 0; }
.battleScr .modebar .tabs { flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.battleScr .modebar .mode-t { flex: none; white-space: nowrap; }
.battleScr .modebar .modesw { flex: none; margin-left: 0; }
.battleScr .tip { max-height: 4.4em; }
@media (max-height: 800px) {
  .battleScr .usebar.idle { display: none; }
